name: API v3 - test-user4 tests
description: Run API v3 tests as test-user4 user (upload permission, only the repositories of the 'ci-test-group' group, #3 and #4, are visible)

inputs:
  api-host:
    description: API test host URL
    required: true
  api-key:
    description: test-user4 API key
    required: true

runs:
  using: composite
  steps:
    - name: (test-user4) Only the repositories of the group are visible
      shell: bash
      env:
        API_HOST: ${{ inputs.api-host }}
        API_KEY: ${{ inputs.api-key }}
      run: |
        source ${{ github.action_path }}/../api.sh

        RESULT=$(api GET /repositories)
        check "$RESULT" '(.data | map(.id) | sort) == [3, 4]'
        check "$RESULT" '.data | all(.groups | index("ci-test-group"))'

        RESULT=$(api GET "/repositories?group=ci-test-group")
        check "$RESULT" '.data | length == 2'

        must_pass GET /repositories/local/3
        must_fail 404 not_found GET /repositories/local/5

    - name: (test-user4) Upload packages to the repositories of the group only
      shell: bash
      env:
        API_HOST: ${{ inputs.api-host }}
        API_KEY: ${{ inputs.api-key }}
      run: |
        source ${{ github.action_path }}/../api.sh
        prepare_packages

        RESULT=$(api POST /repositories/local/3/snapshots/3/packages -F "file=@${DEB_PACKAGE}")
        check "$RESULT" '.data.uploaded | length == 1'
        must_pass POST /repositories/local/4/snapshots/4/packages -F "file=@${RPM_PACKAGE}"

        # Upload is allowed but the repository is not visible
        must_fail 404 not_found POST /repositories/local/5/snapshots/5/packages -F "file=@${DEB_PACKAGE}"

    - name: (test-user4) Actions without permission are refused
      shell: bash
      env:
        API_HOST: ${{ inputs.api-host }}
        API_KEY: ${{ inputs.api-key }}
      run: |
        source ${{ github.action_path }}/../api.sh

        must_fail 403 forbidden GET /repositories/local/3/snapshots/3/packages
        must_fail 403 forbidden POST /repositories/local/3/snapshots/3/rebuild -H "Content-Type: application/json" -d '{"gpg_sign":true}'
        must_fail 403 forbidden DELETE /repositories/local/3
