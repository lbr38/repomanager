name: Deploy documentation
on:
  push:
    branches:
      - devel
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Retrieve Repomanager version
        run: |
          echo "VERSION=$(cat ${GITHUB_WORKSPACE}/www/version)" >> $GITHUB_ENV
          echo "Version: ${{ env.VERSION }}"

      - name: Set up Python environment
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: git config user.name github-actions[bot]
      - run: git config user.email github-actions[bot]@users.noreply.github.com
      - run: git fetch origin gh-pages --depth=1

      - run: pip install -r documentation/requirements.txt

      - run: |
          cd documentation
          mike deploy --push --update-aliases ${{ env.VERSION }} latest
          mike set-default --push latest

      # Root 404: redirect version-less URLs (/usage/operations/) to the latest version
      - name: Publish root 404 redirect
        run: |
          git checkout gh-pages
          cat > 404.html <<'EOF'
          <!DOCTYPE html>
          <html>
            <head>
              <meta charset="utf-8">
              <title>Redirecting</title>
              <script>
                (function () {
                  var path = window.location.pathname.replace(/^\/+/, "");
                  var first = path.split("/")[0];
                  // Avoid redirect loops on paths that are already version-scoped
                  if (first === "latest" || /^\d+\.\d+\.\d+$/.test(first)) {
                    document.write("Page not found.");
                    return;
                  }
                  window.location.replace(
                    "/latest/" + path + window.location.search + window.location.hash
                  );
                })();
              </script>
            </head>
            <body>Redirecting to the latest version...</body>
          </html>
          EOF
          git add 404.html
          git diff --staged --quiet || (git commit -m "Update root 404 redirect" && git push origin gh-pages)
