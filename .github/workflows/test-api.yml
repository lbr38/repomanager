name: Test Repomanager API

on:
  push:

# All the runs share the same test instance (users, repositories, uploads, rebuild tasks):
# never run two of them at the same time, a new run waits for the current one to finish
concurrency:
  group: api-test-instance
  cancel-in-progress: false

jobs:
  api-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install curl
        run: sudo apt-get install curl jq wget -y

      # Default options for all the curl requests of the tests:
      # - a request cannot hang longer than 120 seconds
      # - each request prints its method, URL, HTTP code, duration and curl error to stderr (results captured from stdout are unchanged),
      #   so that a failing test shows whether the API refused the request, returned an error or did not answer at all
      #   (requests that set their own --write-out, e.g. to get the HTTP code, do not print it)
      # - a dedicated User-Agent containing a secret token, whitelisted by CrowdSec on the test instance server
      #   (the tests send many requests that are refused on purpose, which would get the runner IP banned)
      - name: Configure curl
        run: |
          cat > ~/.curlrc << 'EOF'
          user-agent = "repomanager-ci/${{ secrets.API_TEST_USER_AGENT_TOKEN }}"
          max-time = 120
          write-out = "%{stderr}[curl] %{method} %{url} -> HTTP %{http_code} in %{time_total}s (exit %{exitcode}) %{errormsg}\n"
          EOF

      # Wait for the API to be ready
      - name: Wait until API URL is ready
        run: sleep 60
            
      - name: Check if API is reachable
        run: |
          RESULT=$(curl --fail-with-body -L -s ${{ secrets.API_TEST_HOST }})
          if [ $? -ne 0 ]; then
              echo "API is not unreachable"
              exit 1
          fi

      #
      # Download rpm and deb packages from https://packages.repomanager.net that will be used for upload testing
      # To avoid an upload test failure due to the package already been uploaded (when multiple pipelines run at the same time),
      # prefix them with a unique ID (current timestamp) and put them in a directory named after the runner hostname.
      #
      - name: Download test packages
        run: |
          mkdir $HOSTNAME
          UNIQUE_ID=$(date +%s)
          wget -O $HOSTNAME/${UNIQUE_ID}_nginx-1.26.0-1.el7.ngx.x86_64.rpm https://packages.repomanager.net/repo/rpm/ci-test/8/prod/packages/x86_64/nginx-1.26.0-1.el7.ngx.x86_64.rpm
          wget -O $HOSTNAME/${UNIQUE_ID}_nginx_1.26.0-1~bookworm_amd64.deb https://packages.repomanager.net/repo/deb/ci-test/bookworm/main/prod/pool/main/nginx_1.26.0-1~bookworm_amd64.deb

      #
      # Run tests as admin user
      #
      - name: Run admin tasks tests
        uses: ./.github/actions/test-api/v2/admin/tasks
        with:
          api-host: ${{ secrets.API_TEST_HOST }}
          api-key: ${{ secrets.API_TEST_ADMIN_API_KEY }}

      - name: Run admin environment point test
        uses: ./.github/actions/test-api/v2/admin/environment/point
        with:
          api-host: ${{ secrets.API_TEST_HOST }}
          api-key: ${{ secrets.API_TEST_ADMIN_API_KEY }}

      - name: Run admin repositories tests
        uses: ./.github/actions/test-api/v2/admin/repositories
        with:
          api-host: ${{ secrets.API_TEST_HOST }}
          api-key: ${{ secrets.API_TEST_ADMIN_API_KEY }}

      - name: Run admin source repositories tests
        uses: ./.github/actions/test-api/v2/admin/source-repositories
        with:
          api-host: ${{ secrets.API_TEST_HOST }}
          api-key: ${{ secrets.API_TEST_ADMIN_API_KEY }}

      - name: Run admin snapshot details tests
        uses: ./.github/actions/test-api/v2/admin/snapshot/details
        with:
          api-host: ${{ secrets.API_TEST_HOST }}
          api-key: ${{ secrets.API_TEST_ADMIN_API_KEY }}

      - name: Run admin snapshot diff tests
        uses: ./.github/actions/test-api/v2/admin/snapshot/diff
        with:
          api-host: ${{ secrets.API_TEST_HOST }}
          api-key: ${{ secrets.API_TEST_ADMIN_API_KEY }}

      - name: Run admin package list tests
        uses: ./.github/actions/test-api/v2/admin/snapshot/package/list
        with:
          api-host: ${{ secrets.API_TEST_HOST }}
          api-key: ${{ secrets.API_TEST_ADMIN_API_KEY }}

      - name: Run admin package upload tests
        uses: ./.github/actions/test-api/v2/admin/snapshot/package/upload
        with:
          api-host: ${{ secrets.API_TEST_HOST }}
          api-key: ${{ secrets.API_TEST_ADMIN_API_KEY }}

      - name: Run admin hosts tests
        uses: ./.github/actions/test-api/v2/admin/hosts
        with:
          api-host: ${{ secrets.API_TEST_HOST }}
          api-key: ${{ secrets.API_TEST_ADMIN_API_KEY }}

      - name: Run admin single host tests
        uses: ./.github/actions/test-api/v2/admin/host
        with:
          api-host: ${{ secrets.API_TEST_HOST }}
          api-key: ${{ secrets.API_TEST_ADMIN_API_KEY }}

      #
      # Run tests as a regular user: test-user1
      # This user has absolutely no permissions to do anything so all the tests must fail
      #
      - name: Run test-user1 repositories tests
        uses: ./.github/actions/test-api/v2/test-user1/repositories
        with:
          api-host: ${{ secrets.API_TEST_HOST }}
          api-key: ${{ secrets.API_TEST_TEST_USER1_API_KEY }}

      - name: Run test-user1 source repositories tests
        uses: ./.github/actions/test-api/v2/test-user1/source-repositories
        with:
          api-host: ${{ secrets.API_TEST_HOST }}
          api-key: ${{ secrets.API_TEST_TEST_USER1_API_KEY }}

      - name: Run test-user1 package upload tests
        uses: ./.github/actions/test-api/v2/test-user1/snapshot/package/upload
        with:
          api-host: ${{ secrets.API_TEST_HOST }}
          api-key: ${{ secrets.API_TEST_TEST_USER1_API_KEY }}

      - name: Run test-user1 package delete tests
        uses: ./.github/actions/test-api/v2/test-user1/snapshot/package/delete
        with:
          api-host: ${{ secrets.API_TEST_HOST }}
          api-key: ${{ secrets.API_TEST_TEST_USER1_API_KEY }}


      #
      # Run tests as a regular user: test-user2
      # This user has permissions to upload packages and rebuild snapshots metadata
      #
      - name: Run test-user2 repositories tests
        uses: ./.github/actions/test-api/v2/test-user2/repositories
        with:
          api-host: ${{ secrets.API_TEST_HOST }}
          api-key: ${{ secrets.API_TEST_TEST_USER2_API_KEY }}

      - name: Run test-user2 package upload tests
        uses: ./.github/actions/test-api/v2/test-user2/snapshot/package/upload
        with:
          api-host: ${{ secrets.API_TEST_HOST }}
          api-key: ${{ secrets.API_TEST_TEST_USER2_API_KEY }}

      #
      # Run tests as a regular user: test-user3
      # This user can browse packages and only sees repository #5, granted individually
      #
      - name: Run test-user3 repositories tests
        uses: ./.github/actions/test-api/v2/test-user3/repositories
        with:
          api-host: ${{ secrets.API_TEST_HOST }}
          api-key: ${{ secrets.API_TEST_TEST_USER3_API_KEY }}

      #
      # Run tests as a regular user: test-user4
      # This user can upload packages and only sees the repositories of the 'ci-test-group' group (#3 and #4)
      #
      - name: Run test-user4 repositories and upload tests
        uses: ./.github/actions/test-api/v2/test-user4/repositories
        with:
          api-host: ${{ secrets.API_TEST_HOST }}
          api-key: ${{ secrets.API_TEST_TEST_USER4_API_KEY }}

      #
      # API v3 tests, run after the API v2 tests (same users and test repositories)
      #
      - name: Run API v3 admin tests
        uses: ./.github/actions/test-api/v3/admin
        with:
          api-host: ${{ secrets.API_TEST_HOST }}
          api-key: ${{ secrets.API_TEST_ADMIN_API_KEY }}

      - name: Run API v3 admin lifecycle tests
        uses: ./.github/actions/test-api/v3/admin-lifecycle
        with:
          api-host: ${{ secrets.API_TEST_HOST }}
          api-key: ${{ secrets.API_TEST_ADMIN_API_KEY }}

      - name: Run API v3 test-user1 tests
        uses: ./.github/actions/test-api/v3/test-user1
        with:
          api-host: ${{ secrets.API_TEST_HOST }}
          api-key: ${{ secrets.API_TEST_TEST_USER1_API_KEY }}

      - name: Run API v3 test-user2 tests
        uses: ./.github/actions/test-api/v3/test-user2
        with:
          api-host: ${{ secrets.API_TEST_HOST }}
          api-key: ${{ secrets.API_TEST_TEST_USER2_API_KEY }}

      - name: Run API v3 test-user3 tests
        uses: ./.github/actions/test-api/v3/test-user3
        with:
          api-host: ${{ secrets.API_TEST_HOST }}
          api-key: ${{ secrets.API_TEST_TEST_USER3_API_KEY }}

      - name: Run API v3 test-user4 tests
        uses: ./.github/actions/test-api/v3/test-user4
        with:
          api-host: ${{ secrets.API_TEST_HOST }}
          api-key: ${{ secrets.API_TEST_TEST_USER4_API_KEY }}
