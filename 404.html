<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting</title>
    <script>
      (function () {
        var path = window.location.pathname.replace(/^\/+/, "");
        var first = path.split("/")[0];
        // Avoid redirect loops on paths that are already version-scoped
        if (first === "latest" || /^\d+\.\d+\.\d+$/.test(first)) {
          document.write("Page not found.");
          return;
        }
        window.location.replace(
          "/latest/" + path + window.location.search + window.location.hash
        );
      })();
    </script>
  </head>
  <body>Redirecting to the latest version...</body>
</html>
