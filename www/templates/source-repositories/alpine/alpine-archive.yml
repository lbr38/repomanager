---
description: Alpine Linux archived repositories (end of support branches)
type: alpine
repositories:
  # Alpine Linux branches that reached their end of support, still available on the Alpine Linux CDN
  # Older branches do not have all the architectures, and the community repository exists since v3.3
  - name: alpine-archive
    type: alpine
    description: Alpine Linux archived repositories (EOL)
    url: https://dl-cdn.alpinelinux.org/alpine/$branch/$repo
    branches:
      - name: v3.21
        description: Alpine Linux 3.21 (end of support 2026-11-01)
      - name: v3.20
        description: Alpine Linux 3.20 (end of support 2026-04-01)
      - name: v3.19
        description: Alpine Linux 3.19 (end of support 2025-11-01)
      - name: v3.18
        description: Alpine Linux 3.18 (end of support 2025-05-09)
      - name: v3.17
        description: Alpine Linux 3.17 (end of support 2024-11-22)
      - name: v3.16
        description: Alpine Linux 3.16 (end of support 2024-05-23)
      - name: v3.15
        description: Alpine Linux 3.15 (end of support 2023-11-01)
      - name: v3.14
        description: Alpine Linux 3.14 (end of support 2023-05-01)
      - name: v3.13
        description: Alpine Linux 3.13 (end of support 2022-11-01)
      - name: v3.12
        description: Alpine Linux 3.12 (end of support 2022-05-01)
      - name: v3.11
        description: Alpine Linux 3.11 (end of support 2021-11-01)
