        description: Alpine Linux 3.4 (end of support 2018-05-01)
      - name: v3.3
        description: Alpine Linux 3.3 (end of support 2017-11-01)
    repos:
      - name: main
        description: Alpine Linux main
      - name: community
        description: Alpine Linux community (since v3.3)
    archs:
      - name: x86_64
      - name: x86
      - name: aarch64
        description: since v3.5
      - name: armhf
      - name: armv7
        description: since v3.9
      - name: ppc64le
