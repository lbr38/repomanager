---
description: Nginx webserver repositories
type: deb
repositories:
  - name: nginx
    type: deb
    description: Nginx webserver
    url: http://nginx.org/packages/debian
    distributions:
      # Debian 13
      - name: trixie
        description: Debian 13
        components:
          - name: nginx
            archs:
              - amd64
              - arm64
        gpgkeys:
          - link: https://nginx.org/keys/nginx_signing.key

      # Debian 12
      - name: bookworm
        description: Debian 12
        components:
          - name: nginx
            archs:
              - amd64
              - arm64
        gpgkeys:
          - link: https://nginx.org/keys/nginx_signing.key

      # Debian 11
      - name: bullseye
        description: Debian 11
        components:
          - name: nginx
            archs:
              - amd64
              - arm64
        gpgkeys:
          - link: https://nginx.org/keys/nginx_signing.key

      # Debian 10
      - name: buster
        description: Debian 10
        components:
          - name: nginx
            archs:
              - i386
              - amd64
              - arm64
        gpgkeys:
          - link: https://nginx.org/keys/nginx_signing.key

      - name: jessie
        components:
          - name: nginx
            archs:
              - i386
              - amd64
        gpgkeys:
          - link: https://nginx.org/keys/nginx_signing.key

      - name: stretch
        components:
          - name: nginx
            archs:
              - i386
              - amd64
        gpgkeys:
          - link: https://nginx.org/keys/nginx_signing.key
